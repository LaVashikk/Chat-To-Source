<!DOCTYPE html>
<html>

<head>
    <title>Стартовая страница</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1d1d1d;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 50px 20px;
            text-align: center;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        p {
            font-size: 24px;
            margin-bottom: 40px;
        }

        .button-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .button {
            display: inline-block;
            padding: 12px 24px;
            margin: 0 20px 20px 0;
            border-radius: 30px;
            background-color: #ff8c00;
            color: #fff;
            font-size: 20px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .button:hover {
            background-color: #fff;
            color: #ff8c00;
        }

        .event-button {
            display: block;
            padding: 16px 32px;
            margin-top: 40px;
            border-radius: 30px;
            background-color: #ff8c00;
            color: #fff;
            font-size: 20px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .event-button:hover {
            background-color: #fff;
            color: #ff8c00;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 10%;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
          }
          
          footer p {
            margin: 0;
          }
                
          footer a {
            color: #fff;
          }
          
          footer a:hover {
            color: #ff8c00;
          }

        @media (max-width: 600px) {
            .container {
                padding: 30px 10px;
            }

            h1 {
                font-size: 28px;
                margin-bottom: 10px;
            }

            p {
                font-size: 20px;
                margin-bottom: 20px;
            }

            .button-wrapper {
                flex-direction: column;
            }

            .button {
                margin: 0 0 20px 0;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Chat-To-Source Widget</h1>
        <p>Выберите тип виджета: чат или бегущая строчка.</p>
        <div class="button-wrapper">
            <a href="/bar" class="button">Бегущая строчка</a>
            <a href="/chat" class="button">Чат</a>
        </div>
        <a href="/events" class="event-button">DEV страница</a>
    </div>
    <footer>
        <div class="container">
            <p>Created by laVashik</p>
            <a href="https://github.com/IaVashik/Chat-To-Source">
                <p>GitHub repository</p>
            </a>
        </div>
    </footer>

</body>

</html>
