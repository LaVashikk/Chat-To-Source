<!DOCTYPE html>
<html>

<head>
    <title>Отклонённые команды</title>
    <!-- Стили для html страницы -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: transparent;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        #chat {
            position: relative;
            height: 100%;
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            /* border-radius: 10px; */
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            overflow: hidden;
            padding: 1%;
        }

        .message {
            font-family: 'Montserrat', sans-serif;
            display: inline-block;
            
            padding: 0.5% 2%;

           /* font-size: clamp(0.8rem, 1.5vw + 1.5vh, 1.5rem);
            border-radius: 20px;
            background-color: rgba(255, 0, 0, 0.2); 
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);*/
            font-size: 45vh;
            background-color: transparent;
            color: #ffffff;
            text-shadow: 0 0 5px #ff0000, /* Повторяем свечение в разных направлениях для красивого эффекта */
                        0 0 10px #ff6a00,
                        0 0 15px #b61717,
                        0 0 20px #ffa600;

            color: #FFF;
            white-space: nowrap;
            position: absolute;
            right: 0;
            transform: translateX(100%);
        }

    </style>
</head>

<body>
    <!-- Чат контейнер -->
    <div id="chat"></div>
    <!-- Скрипт для анимации сообщений и получения сообщений с сервера -->
    <script>
        const chat = document.getElementById("chat");

        // Массив сообщений в очереди
        const messageQueue = [];

        // Флаг для определения активного сообщения
        let messageInProcess = false;

        // Функция для создания сообщений в чате и анимации их движения
        function createMarqueeMessage(messageText) {
            if (!messageInProcess) {
                messageInProcess = true;
                const messageElement = document.createElement("div");
                messageElement.classList.add("message");
                messageElement.innerHTML = messageText;
                chat.appendChild(messageElement);
                const speed = 150;
                const desiredGap = 200;

                const animationDuration = (chat.offsetWidth + messageElement.offsetWidth) / speed;

                const waitingPeriod = messageElement.offsetWidth / speed;

                // Запуск анимации
                setTimeout(() => {
                    messageElement.style.animationName = "scroll";
                    messageElement.style.animationDuration = `${animationDuration}s`;
                    messageElement.style.animationTimingFunction = "linear";
                    messageElement.style.animationIterationCount = "once";
                    messageElement.style.animationFillMode = "forwards";
                    messageElement.style.animationDelay = "0s";
                }, 0);

                setTimeout(() => {
                    messageInProcess = false;
                    // Запускаем следующее сообщение из очереди, если есть
                    if (messageQueue.length > 0) {
                        createMarqueeMessage(messageQueue.shift());
                    }
                }, (waitingPeriod + 1.36) * 1000);


                // Удаляем сообщение после окончания анимации
                setTimeout(() => {
                    chat.removeChild(messageElement);

                }, (animationDuration + (messageElement.offsetWidth) / speed) * 1000);
            } else {
                messageQueue.push(messageText);
            }
        }

        // Получаем сообщения с сервера
        const evtSource = new EventSource("/events");
        evtSource.onmessage = function (event) {
            const messageText = event.data.split(',')[0];
            createMarqueeMessage(messageText);
        };

        // Keyframes анимации scroll
        const style = document.createElement('style');
        style.type = 'text/css';
        style.innerHTML = `
        @keyframes scroll {
        0% {
            transform: translateX(100%);
            opacity: 1;
            scale(1);
        }
        33% {
            opacity: 0.6;
            scale(0.5);
        }
        66% {
            opacity: 1;
            scale(1);
        }
        100% {
            transform: translateX(calc(-100% - 100vw));
            opacity: 0.6;
            scale(0.5);
        }
    }
    `;
        document.head.appendChild(style);
    </script>
</body>

</html>
