# Chat2Source Forbidden Commands Configuration

# Forbidden console commands
commands = [
    "quit", "exit", "disconnect", "retry", "changelevel",
    "map", "restart", "sv_cheats", "rcon", "status",
    "kick", "ban", "banid", "removeid", "writeip",
    "exec", "alias", "bind", "unbind", "unbindall",
    "developer", "fps_max", "mat_wireframe"
]

# Forbidden entities that can be spawned
entities = [
    "func_breakable", "trigger_hurt", "env_explosion",
    "point_hurt", "game_end", "logic_relay",
    "env_fire", "env_physexplosion", "trigger_teleport",
    "func_door", "func_button", "func_breakable_surf"
]

# Forbidden script commands
scripts = [
    "exec", "alias", "bind", "unbind", "unbindall",
    "echo", "clear", "condump", "log"
]

# Script exceptions (allowed even if in scripts list)
script_exceptions = [
    "exec autoexec.cfg",
    "exec config.cfg",
    "exec userconfig.cfg"
]

[cvar_limits]
# Enable cvar value filtering
enable_filter = true
# Default maximum value for cvars
default_max = 100

# Individual cvar limits
[cvar_limits.individual_max]
sv_gravity = 800
host_timescale = 1
sv_airaccelerate = 10
sv_friction = 4
sv_stopspeed = 100
fps_max = 300
rate = 100000
cl_updaterate = 128
cl_cmdrate = 128

