# Chat2Source Settings Configuration

[stream]
# Platform: "youtube" or "twitch"
platform = "youtube"
# Stream URL or identifier
url = ""
# Update interval in seconds
update_interval = 1.0

[widget]
# Widget server host
host = "127.0.0.1"
# Widget server port
port = 5000
# Debug mode
debug = false

[game]
# NetCon connection settings
netcon_host = "127.0.0.1"
netcon_port = 2121
# Auto-reconnect to game
auto_reconnect = true

[logging]
# Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL
level = "INFO"
# Log format
format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

